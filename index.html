<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <!--
      `blob:` in img-src is load-bearing: the share card is drawn on a canvas and
      previewed via URL.createObjectURL, which a stricter policy blocks outright
      (the image silently never renders, which is exactly how this bit broke once
      before). Supabase needs both https and wss for Realtime rooms.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; worker-src 'self'; manifest-src 'self'; img-src 'self' data: blob: https://cdn.discordapp.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://discord.com https://*.discord.com;"
    />
    <title>Guess the Language</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#07111e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="app"></div>
    <!--
      Runtime config, loaded before the bundle so one build artifact can be
      pointed at different Supabase projects / Discord apps without rebuilding.
      Both are optional: missing config degrades to offline play.
    -->
    <script src="/supabase-config.js"></script>
    <script src="/discord-config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
