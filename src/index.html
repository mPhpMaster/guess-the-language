<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co;" />
  <title>Guess the Programming Language</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== Custom title bar (kept LTR like native window chrome) ===== -->
  <header class="titlebar" dir="ltr">
    <div class="titlebar-left">
      <span class="win-logo">▦</span>
      <span class="titlebar-title" data-i18n="appTitle">Guess the Programming Language</span>
    </div>
    <div class="titlebar-controls">
      <button class="tb-btn" id="tb-min" title="Minimize">&#8211;</button>
      <button class="tb-btn" id="tb-max" title="Maximize">&#9633;</button>
      <button class="tb-btn tb-close" id="tb-close" title="Close">&#10005;</button>
    </div>
  </header>

  <main id="app">

    <!-- ============ MODE SELECT SCREEN ============ -->
    <section id="screen-modeselect" class="screen active">
      <div class="modeselect-card">
        <div class="lang-switch">
          <button data-setlang="en">EN</button>
          <button data-setlang="ar">ع</button>
        </div>
        <h1 class="ms-title" data-i18n="modeSelectTitle">Choose a game mode</h1>
        <div class="mode-grid">
          <button class="mode-card" data-mode="languages">
            <div class="mode-icon">&#128187;</div>
            <div class="mode-name" data-i18n="modeLanguages">Programming Languages</div>
            <div class="mode-desc" data-i18n="modeLanguagesDesc">Guess the language from a code snippet</div>
          </button>
          <button class="mode-card mode-card-cyber" data-mode="cybersecurity">
            <div class="mode-icon">&#128737;&#65039;</div>
            <div class="mode-name" data-i18n="modeCyber">Cybersecurity</div>
            <div class="mode-desc" data-i18n="modeCyberDesc">Tools, malware, Nmap, Metasploit &amp; more</div>
          </button>
          <button class="mode-card mode-card-all" data-mode="all">
            <div class="mode-icon">&#127922;</div>
            <div class="mode-name" data-i18n="modeAll">All (Mixed)</div>
            <div class="mode-desc" data-i18n="modeAllDesc">Everything: languages + cybersecurity</div>
          </button>
        </div>
      </div>
    </section>

    <!-- ============ MENU SCREEN ============ -->
    <section id="screen-menu" class="screen">
      <div class="menu-card">
        <button class="modes-back" id="btn-modes">&#8592; <span data-i18n="changeMode">Modes</span></button>
        <div class="lang-switch">
          <button data-setlang="en">EN</button>
          <button data-setlang="ar">ع</button>
        </div>
        <div class="menu-logo" id="menu-logo">&#128187;</div>
        <h1 class="menu-title">
          <span id="menu-title-1">Guess the</span><br>
          <span class="neon" id="menu-title-2">Programming Language</span>
        </h1>
        <p class="menu-sub" id="menu-sub">Identify the language from the snippet before time runs out</p>

        <div class="menu-buttons">
          <button class="btn btn-primary" id="btn-start" data-i18n="start">▶  Start</button>
          <button class="btn btn-ghost" id="btn-friends" data-i18n="friends">👥  Friends &amp; Scores</button>
          <button class="btn btn-ghost" id="btn-settings" data-i18n="settings">⚙  Settings</button>
        </div>

        <div class="menu-highscore">
          <span data-i18n="bestScore">Best score:</span> <strong id="menu-highscore-val">0</strong>
        </div>
      </div>

      <!-- Settings popover -->
      <div id="settings-panel" class="popover hidden">
        <h3 data-i18n="settingsTitle">Settings</h3>
        <label class="setting-row">
          <span data-i18n="settingLanguage">Language</span>
          <select id="set-language">
            <option value="en">English</option>
            <option value="ar">العربية</option>
          </select>
        </label>
        <label class="setting-row">
          <span data-i18n="settingName">Your leaderboard name</span>
          <input type="text" id="set-name" maxlength="24" placeholder="Player" />
        </label>
        <label class="setting-row">
          <span data-i18n="settingQuestions">Questions per round</span>
          <select id="set-questions">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
        </label>
        <label class="setting-row">
          <span data-i18n="settingSound">Sound effects</span>
          <input type="checkbox" id="set-sound" checked />
        </label>
        <label class="setting-row">
          <span data-i18n="settingDifficulty">Difficulty</span>
          <select id="set-difficulty">
            <option value="all" data-i18n="diffAll">All</option>
            <option value="easy" data-i18n="diffEasy">Easy</option>
            <option value="medium" data-i18n="diffMedium">Medium</option>
            <option value="hard" data-i18n="diffHard">Hard</option>
          </select>
        </label>
        <button class="btn btn-primary btn-sm" id="set-close" data-i18n="save">Save &amp; Close</button>
      </div>
    </section>

    <!-- ============ GAME SCREEN ============ -->
    <section id="screen-game" class="screen">
      <div class="game-topbar">
        <div class="score-pill"><span data-i18n="score">Score:</span> <span id="game-score">0</span></div>
        <div class="streak-pill hidden" id="streak-pill">🔥 <span id="streak-count">0</span> &nbsp;×1.5</div>
        <div class="progress-pill">
          <span data-i18n="question">Question</span>
          <span id="q-current">1</span> / <span id="q-total">10</span>
        </div>
      </div>

      <div class="game-body">
        <div class="code-wrap" id="code-wrap">
          <div class="code-header">
            <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
            <span class="code-difficulty" id="code-difficulty">easy</span>
          </div>
          <pre class="code-panel" dir="ltr"><code id="code-snippet"></code></pre>
          <div class="toast" id="answer-toast"></div>
        </div>

        <div class="timer-ring" id="timer-ring">
          <svg viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="52" />
            <circle class="ring-fg" id="ring-fg" cx="60" cy="60" r="52" />
          </svg>
          <div class="timer-num" id="timer-num" dir="ltr">15</div>
        </div>
      </div>

      <div id="question-text" class="question-text" dir="auto"></div>

      <div class="options-grid" id="options-grid" dir="ltr"><!-- option buttons injected --></div>
    </section>

    <!-- ============ RESULTS SCREEN ============ -->
    <section id="screen-results" class="screen">
      <div class="results-card">
        <div class="trophy">&#127942;</div>
        <h2 class="final-score"><span data-i18n="finalScore">Final Score:</span> <span id="final-score">0</span></h2>
        <p class="results-sub" data-i18n="comparison">Friends Comparison</p>
        <div class="lb-note" id="lb-note"></div>
        <div class="leaderboard" id="leaderboard"><!-- rows injected --></div>

        <div class="results-buttons">
          <button class="btn btn-primary" id="btn-challenge" data-i18n="challenge">🔗  Challenge a friend</button>
          <button class="btn btn-accent" id="btn-replay" data-i18n="replay">🔄  Play again</button>
          <button class="btn btn-ghost" id="btn-menu" data-i18n="backMenu">🏠  Main menu</button>
        </div>
      </div>
    </section>

  </main>

  <script src="supabase-config.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
